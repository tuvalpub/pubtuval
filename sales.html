<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מכירות - פאב תובל</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-form, .sales-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: 20px auto 0 auto;
        }

        .login-form input, .sales-form input, .sales-form select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            width: 100%;
            height: 42px;
            background-color: #fff;
        }

        .login-form button, .sales-form button {
            padding: 12px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-form button:hover, .sales-form button:hover {
            background-color: #FFD700;
            color: #333;
        }

        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: green;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        #protected-content {
            display: none;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: right;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
        }

        .price-summary {
            font-size: 18px;
            font-weight: bold;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="logo">
    <img src="logo.jpeg" alt="לוגו פאב תובל">
</div>

<nav>
    <a href="index.html">חזרה לאתר</a>
</nav>

<div class="section active">

    <!-- מסך התחברות -->
    <div id="login-card" class="card" style="text-align: center;">
        <h2>כניסה למערכת המכירות</h2>
        <p>יש להזין סיסמה כדי לגשת למערכת:</p>
        
        <form class="login-form" onsubmit="checkPassword(event)">
            <input type="password" id="password" placeholder="הכנס סיסמה..." required>
            <button type="submit">התחבר</button>
        </form>
        
        <div id="error-msg" class="error-message">סיסמה שגויה, נסה שוב.</div>
    </div>

    <!-- אזור תוכן מוגן - טופס מכירה -->
    <div id="protected-content" class="card" style="text-align: center;">
        <h2>מערכת רישום מכירות</h2>
        
        <form class="sales-form" onsubmit="submitSale(event)">
            <div class="form-group">
                <label for="sellerName">שם המוכר (משמרת):</label>
                <input type="text" id="sellerName" placeholder="שם המוכר/ברמן..." required onchange="saveSellerName()">
            </div>

            <div class="form-group">
                <label for="buyerName">שם הקונה:</label>
                <input type="text" id="buyerName" placeholder="שם הקונה/חבר הקהילה..." required>
            </div>

            <div class="form-group">
                <label for="productSelect">בחר מוצר מהמלאי:</label>
                <select id="productSelect" onchange="calculateTotal()" required>
                    <option value="" disabled selected>טוען מוצרים...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">כמות:</label>
                <input type="number" id="quantity" value="1" min="1" oninput="calculateTotal()" required>
            </div>

            <div class="price-summary">
                סה"כ לתשלום: <span id="totalPriceDisplay">0</span> ₪
            </div>

            <button type="submit" id="submitBtn">שלח עדכון</button>
        </form>

        <div id="status-success" class="success-message">העסקה נרשמה בהצלחה והמלאי עודכן!</div>
        <div id="status-error" class="error-message">אירעה שגיאה בשליחת הנתונים. נסה שוב.</div>
    </div>

</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzoY4kOSv1dSt2zJA_MVYQcxGPkfokva_LjLvuPKDMLDibdN5WmotHmcEc-f6HK1h61/exec';

    function checkPassword(event) {
        event.preventDefault();
        const passwordInput = document.getElementById('password').value;
        const correctPassword = "1234";

        if (passwordInput === correctPassword) {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
            
            if (localStorage.getItem('tuval_seller_name')) {
                document.getElementById('sellerName').value = localStorage.getItem('tuval_seller_name');
            }

            loadProducts();
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    function saveSellerName() {
        const sellerName = document.getElementById('sellerName').value;
        localStorage.setItem('tuval_seller_name', sellerName);
    }

    function loadProducts() {
        const script = document.createElement('script');
        script.src = `${scriptURL}?callback=handleProductsResponse&t=${new Date().getTime()}`;
        document.body.appendChild(script);
    }

    function handleProductsResponse(data) {
        if (data.result === 'success') {
            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="" disabled selected>בחר מוצר...</option>';
            
            data.products.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = `${item.name} (${item.price} ₪) - במלאי: ${item.stock}`;
                opt.dataset.price = item.price;
                select.appendChild(opt);
            });
        }
    }

    function calculateTotal() {
        const select = document.getElementById('productSelect');
        const selectedOption = select.options[select.selectedIndex];
        const quantity = parseInt(document.getElementById('quantity').value) || 0;
        
        if (selectedOption && selectedOption.dataset.price) {
            const unitPrice = parseFloat(selectedOption.dataset.price);
            const total = unitPrice * quantity;
            document.getElementById('totalPriceDisplay').innerText = total;
        } else {
            document.getElementById('totalPriceDisplay').innerText = '0';
        }
    }

    function submitSale(event) {
        event.preventDefault();

        const btn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('status-success');
        const errorMsg = document.getElementById('status-error');

        successMsg.style.display = 'none';
        errorMsg.style.display = 'none';

        btn.disabled = true;
        btn.innerText = 'שולח...';

        const sellerName = document.getElementById('sellerName').value;
        const buyerName = document.getElementById('buyerName').value;
        const product = document.getElementById('productSelect').value;
        const quantity = document.getElementById('quantity').value;
        const totalPrice = document.getElementById('totalPriceDisplay').innerText;

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                sellerName: sellerName,
                buyerName: buyerName,
                product: product, 
                quantity: quantity, 
                totalPrice: totalPrice 
            })
        })
        .then(() => {
            btn.disabled = false;
            btn.innerText = 'שלח עדכון';
            successMsg.style.display = 'block';

            document.getElementById('buyerName').value = '';
            document.getElementById('productSelect').selectedIndex = 0;
            document.getElementById('quantity').value = '1';
            calculateTotal();
            
            loadProducts();
        })
        .catch(error => {
            console.error('Error!', error.message);
            btn.disabled = false;
            btn.innerText = 'שלח עדכון';
            errorMsg.style.display = 'block';
        });
    }
</script>

</body>
</html>
