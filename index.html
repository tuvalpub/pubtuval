<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>פאב תובל</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            direction: rtl;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #222;
            padding: 15px;
            color: white;
            font-size: 22px;
        }

        nav {
            background-color: #333;
            padding: 10px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        #logo {
            margin-top: 30px;
        }

        #logo img {
            width: 300px;
            max-width: 80%;
            height: auto;
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
        }

        p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        פאב תובל — מערכת ניהול
    </header>

    <nav>
        <a href="#">דף הבית</a>
        <a href="#">לוח פעילויות</a>
        <a href="#">מכירות</a>
        <a href="#">התחברות</a>
    </nav>

    <div id="logo">
        <img src="logo.jpeg" alt="Tuval Pub Logo">
    </div>

    <h1>ברוכים הבאים לפאב תובל</h1>
    <p>האתר בבנייה...</p>

</body>
</html>
